<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f4f4f4;
    }
    #sheet-container {
      display: none;
      margin-top: 20px;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 18px;
      width: 120px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Enter PIN to View Portfolio</h2>
  <input type="password" id="pinInput" maxlength="4" placeholder="****">
  <br>
  <button onclick="checkPIN()">Submit</button>

  <div id="sheet-container">
    <h2>📊 My Live Portfolio</h2>
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSPXMcRYCrWDMBH0HbAdTUdJuvGWXprwm1gs6eVUJGTP65C03r3wfOFDxQcmmJAg5rt35RCjZZ2up7C/pubhtml?gid=1557776626&single=true"></iframe>
  </div>

  <script>
    function checkPIN() {
      const pin = document.getElementById("pinInput").value;
      if (pin === "2580") {
        document.getElementById("sheet-container").style.display = "block";
        document.getElementById("pinInput").style.display = "none";
        document.querySelector("button").style.display = "none";
      } else {
        alert("Incorrect PIN. Try again.");
      }
    }
  </script>
</body>
</html>
